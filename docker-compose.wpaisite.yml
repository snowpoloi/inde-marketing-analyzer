# wpaisite — test WordPress site for the AI Site Bridge plugin.
# Lives at the repo root so the Docker build context ('.') includes the
# ai-site-bridge/ plugin folder (Coolify-friendly, no '..' contexts).
#
# Coolify: Docker Compose resource, compose location /docker-compose.wpaisite.yml,
# env var WORDPRESS_DB_PASSWORD required, domain on the "wordpress" service.

services:
  wordpress:
    build:
      context: .
      dockerfile: wpaisite/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wp_data:
  db_data:
