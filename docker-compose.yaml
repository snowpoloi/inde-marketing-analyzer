services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inde_marketing}
      POSTGRES_USER: ${POSTGRES_USER:-inde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inde} -d ${POSTGRES_DB:-inde_marketing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://inde:change-me-db-password@db:5432/inde_marketing}
      SECRET_KEY: ${SECRET_KEY:-change-me-long-random-secret}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://analyzer.inde.gr,http://localhost:3000,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inde.gr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      SYNC_DAILY_HOUR: ${SYNC_DAILY_HOUR:-4}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Athens}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://inde:change-me-db-password@db:5432/inde_marketing}
      SECRET_KEY: ${SECRET_KEY:-change-me-long-random-secret}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://analyzer.inde.gr,http://localhost:3000,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@inde.gr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      SYNC_DAILY_HOUR: ${SYNC_DAILY_HOUR:-4}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Europe/Athens}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m worker.main"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
