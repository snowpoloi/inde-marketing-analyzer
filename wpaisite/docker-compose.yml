# wpaisite — test WordPress site for the AI Site Bridge plugin.
#
# Coolify setup:
#   1. + New Resource -> Docker Compose -> this repository,
#      branch: claude/wordpress-ai-builder-2q4mhh
#   2. Docker Compose location: /wpaisite/docker-compose.yml
#   3. Set the WORDPRESS_DB_PASSWORD env var (any strong value).
#   4. Attach your domain to the "wordpress" service (port 80) and deploy.

services:
  wordpress:
    build:
      context: ..
      dockerfile: wpaisite/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
    ports:
      - "80"

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wp_data:
  db_data:
